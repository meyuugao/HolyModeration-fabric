buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.ow2.asm:asm:9.5"
        classpath "org.ow2.asm:asm-commons:9.5"
        classpath "org.ow2.asm:asm-tree:9.5"
        classpath "com.google.code.gson:gson:2.10.1"
    }
}


import org.objectweb.asm.*
import org.objectweb.asm.commons.*
import org.objectweb.asm.tree.*
import java.util.jar.JarFile
import java.util.jar.JarOutputStream
import java.util.zip.ZipEntry
import java.util.regex.Pattern

tasks.register("obfuscateJar") {
    dependsOn remapJar
    group = "build"
    description = "Создает обфусцированную версию JAR файла"

    doLast {
        String pkgPrefix = "me/yuugao/holymoderation/"

        File inputJar = remapJar.archiveFile.get().asFile
        File outputJar = new File(inputJar.parentFile, inputJar.name.replace(".jar", "") + "-obfuscated.jar")

        println("=== НАЧАЛО ОБФУСКАЦИИ ===")
        println("Входной файл: " + inputJar.name)
        println("Выходной файл: " + outputJar.name)

        Map<String, String> classMapping = [:]
        Map<String, String> methodMapping = [:]
        Map<String, String> fieldMapping = [:]
        Map<String, String> paramMapping = [:]
        Map<String, Set<String>> superClasses = [:]
        Set<String> dontObfClasses = new HashSet<>()
        Set<String> dontObfMethods = new HashSet<>()
        Set<String> dontObfFields = new HashSet<>()
        Random random = new Random(System.currentTimeMillis())

        JarFile originalJar = new JarFile(inputJar.getAbsolutePath())
        Map<String, byte[]> classData = [:]

        Enumeration entriesEnum = originalJar.entries()
        while (entriesEnum.hasMoreElements()) {
            def entry = entriesEnum.nextElement()
            if (entry.name.endsWith(".class") && entry.name.startsWith(pkgPrefix)) {
                InputStream is = originalJar.getInputStream(entry)
                byte[] bytes = is.bytes
                is.close()

                String internalName = entry.name.replace(".class", "")
                classData.put(internalName, bytes)

                ClassReader reader = new ClassReader(bytes)
                ClassNode node = new ClassNode()
                reader.accept(node, ClassReader.EXPAND_FRAMES)

                boolean hasClassDontObf = node.visibleAnnotations != null && node.visibleAnnotations.any { it.desc == "Lme/yuugao/holymoderation/client/obfuscation/DontObf;" }
                if (hasClassDontObf) {
                    dontObfClasses.add(internalName)
                    println("КЛАСС С @dontobf: " + internalName)
                }

                int idx = internalName.lastIndexOf("/")
                String packageName = internalName.substring(0, idx)
                String protectedPrefix1 = "me/yuugao/holymoderation"
                String protectedPrefix2 = "me/yuugao/holymoderation/client"
                String mixinPrefix = "me/yuugao/holymoderation/client/mixin"

                if (internalName.contains('$')) {
                    String outer = internalName.substring(0, internalName.indexOf('$'))
                    String innerPart = internalName.substring(internalName.indexOf('$'))
                    if (classMapping.containsKey(outer)) {
                        classMapping.put(internalName, classMapping.get(outer) + innerPart)
                    } else {
                        String genOuter = generateRandomClassName(random)
                        String newOuterInternal
                        if (outer.startsWith(mixinPrefix)) {
                            if (!classMapping.containsKey(mixinPrefix)) {
                                String newMixinDir = protectedPrefix2 + "/" + generateRandomPackageName(random)
                                classMapping.put(mixinPrefix, newMixinDir)
                            }
                            newOuterInternal = classMapping.get(mixinPrefix) + "/" + genOuter
                        } else if (outer.startsWith(protectedPrefix2)) {
                            String suffix = outer.substring(protectedPrefix2.length())
                            String[] parts = suffix.split("/")
                            StringBuilder sb = new StringBuilder(protectedPrefix2)
                            for (String part : parts) {
                                if (!part.isEmpty()) sb.append("/").append(generateRandomPackageName(random))
                            }
                            newOuterInternal = sb.toString() + "/" + genOuter
                        } else if (outer.startsWith(protectedPrefix1)) {
                            String suffix = outer.substring(protectedPrefix1.length())
                            String[] parts = suffix.split("/")
                            StringBuilder sb = new StringBuilder(protectedPrefix1)
                            for (String part : parts) {
                                if (!part.isEmpty()) sb.append("/").append(generateRandomPackageName(random))
                            }
                            newOuterInternal = sb.toString() + "/" + genOuter
                        } else {
                            String outerIdxPkg = outer.substring(0, outer.lastIndexOf("/"))
                            String[] parts = outerIdxPkg.split("/")
                            StringBuilder sb = new StringBuilder()
                            for (String part : parts) {
                                if (!part.isEmpty()) sb.append(generateRandomPackageName(random)).append("/")
                            }
                            newOuterInternal = sb.toString().replaceAll("\$", "") + "/" + genOuter
                        }
                        if (!classMapping.containsKey(outer)) {
                            classMapping.put(outer, newOuterInternal)
                        } else {
                            newOuterInternal = classMapping.get(outer)
                        }
                        classMapping.put(internalName, newOuterInternal + innerPart)
                    }
                } else {
                    if (!classMapping.containsKey(internalName)) {
                        String newInternalName
                        if (packageName.startsWith(mixinPrefix)) {
                            if (!classMapping.containsKey(mixinPrefix)) {
                                String newMixinDir = protectedPrefix2 + "/" + generateRandomPackageName(random)
                                classMapping.put(mixinPrefix, newMixinDir)
                            }
                            newInternalName = classMapping.get(mixinPrefix) + "/" + generateRandomClassName(random)
                        } else if (packageName.startsWith(protectedPrefix2)) {
                            String suffix = packageName.substring(protectedPrefix2.length())
                            String[] parts = suffix.split("/")
                            StringBuilder sb = new StringBuilder(protectedPrefix2)
                            for (String part : parts) {
                                if (!part.isEmpty()) sb.append("/").append(generateRandomPackageName(random))
                            }
                            newInternalName = sb.toString() + "/" + generateRandomClassName(random)
                        } else if (packageName.startsWith(protectedPrefix1)) {
                            String suffix = packageName.substring(protectedPrefix1.length())
                            String[] parts = suffix.split("/")
                            StringBuilder sb = new StringBuilder(protectedPrefix1)
                            for (String part : parts) {
                                if (!part.isEmpty()) sb.append("/").append(generateRandomPackageName(random))
                            }
                            newInternalName = sb.toString() + "/" + generateRandomClassName(random)
                        } else {
                            String[] parts = packageName.split("/")
                            StringBuilder sb = new StringBuilder()
                            for (String part : parts) {
                                if (!part.isEmpty()) sb.append(generateRandomPackageName(random)).append("/")
                            }
                            newInternalName = sb.toString().replaceAll("\$", "") + "/" + generateRandomClassName(random)
                        }
                        classMapping.put(internalName, newInternalName)
                        println("КЛАСС: " + internalName + " -> " + newInternalName)
                    } else {
                        println("МАППИНГ УЖЕ СУЩЕСТВУЕТ: " + internalName + " -> " + classMapping.get(internalName))
                    }
                }

                for (MethodNode method : node.methods) {
                    String methodKey = internalName + "." + method.name + method.desc
                    boolean hasMethodDontObf = method.visibleAnnotations != null && method.visibleAnnotations.any { it.desc == "Lme/yuugao/holymoderation/client/obfuscation/DontObf;" }
                    if (hasMethodDontObf) {
                        dontObfMethods.add(methodKey)
                        println("МЕТОД С @dontobf: " + internalName + "." + method.name + method.desc)
                    }
                    if (!hasMethodDontObf && method.name != "<init>" && method.name != "<clinit>" && !hasClassDontObf) {
                        String genKey = internalName + "." + method.name + method.desc
                        if (!methodMapping.containsKey(genKey)) {
                            String genName = generateRandomMethodName(random)
                            methodMapping.put(genKey, genName)
                            String mappedOwner = classMapping.containsKey(internalName) ? classMapping.get(internalName) : internalName
                            String genKeyMapped = mappedOwner + "." + method.name + method.desc
                            methodMapping.put(genKeyMapped, genName)
                            println("НОВЫЙ МЕТОД: " + genKey + " -> " + methodMapping.get(genKey))
                        }
                    }
                }

                for (FieldNode field : node.fields) {
                    String fieldKeyFull = internalName + "." + field.name
                    boolean hasFieldDontObf = field.visibleAnnotations != null && field.visibleAnnotations.any { it.desc == "Lme/yuugao/holymoderation/client/obfuscation/DontObf;" }
                    if (hasFieldDontObf) {
                        dontObfFields.add(fieldKeyFull)
                        println("ПОЛЕ С @dontobf: " + fieldKeyFull)
                    }
                    if (!hasFieldDontObf && !hasClassDontObf) {
                        if (!fieldMapping.containsKey(fieldKeyFull)) {
                            String genField = generateRandomFieldName(random)
                            fieldMapping.put(fieldKeyFull, genField)
                            String mappedOwner = classMapping.containsKey(internalName) ? classMapping.get(internalName) : internalName
                            String fieldKeyMapped = mappedOwner + "." + field.name
                            fieldMapping.put(fieldKeyMapped, genField)
                            println("НОВОЕ ПОЛЕ: " + field.name + " -> " + genField)
                        }
                    }
                }

                for (MethodNode method : node.methods) {
                    String methodKey = internalName + "." + method.name + method.desc
                    boolean hasMethodDontObf = method.visibleAnnotations != null && method.visibleAnnotations.any { it.desc == "Lme/yuugao/holymoderation/client/obfuscation/DontObf;" }
                    if (!hasMethodDontObf && !hasClassDontObf) {
                        List<String> paramTypes = parseMethodDescriptor(method.desc)
                        if (paramTypes != null && paramTypes.size() > 0 && method.localVariables != null) {
                            int paramIndex = ((method.access & Opcodes.ACC_STATIC) == 0) ? 1 : 0
                            for (LocalVariableNode localVar : method.localVariables) {
                                int idx1 = localVar.index
                                if (idx1 >= paramIndex && idx1 < paramIndex + paramTypes.size()) {
                                    String obfClassName = classMapping.containsKey(internalName) ? classMapping.get(internalName) : internalName
                                    String obfMethodName = methodMapping.containsKey(methodKey) ? methodMapping.get(methodKey) : method.name
                                    String paramKey = obfClassName + "." + obfMethodName + "." + (idx1 - paramIndex)
                                    String originalParamKey = internalName + "." + obfMethodName + "." + (idx1 - paramIndex)
                                    if (!paramMapping.containsKey(paramKey)) {
                                        String genParam = generateRandomParamName(random)
                                        paramMapping.put(paramKey, genParam)
                                        paramMapping.put(originalParamKey, genParam)
                                        println("НОВЫЙ АРГУМЕНТ: " + obfMethodName + " " + localVar.name + " -> " + genParam)
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        originalJar.close()

        for (Map.Entry<String, byte[]> entryPair : classData.entrySet()) {
            String internalName = entryPair.key
            ClassReader reader = new ClassReader(entryPair.value)
            ClassNode node = new ClassNode()
            reader.accept(node, ClassReader.SKIP_FRAMES)
            Set<String> parents = new HashSet<>()
            if (node.superName != null) parents.add(node.superName)
            if (node.interfaces != null) parents.addAll(node.interfaces)
            superClasses.put(internalName, parents)
        }

        println("Сгенерировано маппингов классов: " + classMapping.size())
        println("Сгенерировано маппингов методов: " + methodMapping.size())
        println("Сгенерировано маппингов полей: " + fieldMapping.size())
        println("Сгенерировано маппингов параметров: " + paramMapping.size())
        println("Классов с @dontobf: " + dontObfClasses.size())
        println("Методов с @dontobf: " + dontObfMethods.size())
        println("Полей с @dontobf: " + dontObfFields.size())

        Map<String, Map<String, Map<Integer, String>>> localVarMapping = [:]

        for (Map.Entry<String, byte[]> entryPair : classData.entrySet()) {
            String internalName = entryPair.key
            byte[] bytes = entryPair.value
            ClassReader reader = new ClassReader(bytes)
            ClassNode node = new ClassNode()
            reader.accept(node, ClassReader.EXPAND_FRAMES)
            localVarMapping.put(internalName, [:])
            for (MethodNode method : node.methods) {
                localVarMapping.get(internalName).put(method.name, [:])
                List<String> paramTypes = parseMethodDescriptor(method.desc)
                if (paramTypes == null || method.localVariables == null) continue
                int paramIndex = ((method.access & Opcodes.ACC_STATIC) == 0) ? 1 : 0
                for (int i = 0; i < paramTypes.size(); i++) {
                    int lvIndex = paramIndex + i
                    if (lvIndex < method.localVariables.size()) {
                        String paramKey = internalName + "." + method.name + "." + i
                        if (paramMapping.containsKey(paramKey)) {
                            localVarMapping.get(internalName).get(method.name).put(lvIndex, paramMapping.get(paramKey))
                        }
                    }
                }
                if (method.localVariables != null) {
                    for (LocalVariableNode localVar : method.localVariables) {
                        if (localVar.name != null && localVar.name != "this") {
                            String oldName = localVar.name
                            localVar.name = generateRandomParamName(random)
                            println("ЛОКАЛЬНАЯ ПЕРЕМЕННАЯ: " + oldName + " -> " + localVar.name)
                        }
                    }
                }
            }
        }

        Remapper remapper = new Remapper() {
            @Override
            String map(String internalName) {
                if (!internalName.startsWith(pkgPrefix)) return internalName
                if (classMapping.containsKey(internalName)) return classMapping.get(internalName)
                return internalName
            }

            @Override
            String mapMethodName(String owner, String name, String descriptor) {
                if (!owner.startsWith(pkgPrefix)) return name
                Set<String> ownersToCheck = new HashSet<>()
                ownersToCheck.add(owner)
                if (superClasses.containsKey(owner)) ownersToCheck.addAll(superClasses.get(owner))
                for (String o : ownersToCheck) {
                    String key = o + "." + name + descriptor
                    if (dontObfClasses.contains(o)) return name
                    if (dontObfMethods.contains(key)) return name
                    if (methodMapping.containsKey(key)) return methodMapping.get(key)
                }
                return name
            }

            @Override
            String mapFieldName(String owner, String name, String descriptor) {
                if (!owner.startsWith(pkgPrefix)) return name
                Set<String> ownersToCheck = new HashSet<>()
                ownersToCheck.add(owner)
                if (superClasses.containsKey(owner)) ownersToCheck.addAll(superClasses.get(owner))
                for (String o : ownersToCheck) {
                    String key = o + "." + name
                    if (dontObfClasses.contains(o)) return name
                    if (dontObfFields.contains(key)) return name
                    if (fieldMapping.containsKey(key)) return fieldMapping.get(key)
                }
                return name
            }
        }

        JarFile jarFile = new JarFile(inputJar.getAbsolutePath())
        JarOutputStream tempJar = new JarOutputStream(new FileOutputStream(outputJar.getAbsolutePath()))

        Enumeration jarEntries = jarFile.entries()
        while (jarEntries.hasMoreElements()) {
            def entry = jarEntries.nextElement()
            InputStream is = jarFile.getInputStream(entry)
            byte[] bytes = is.bytes
            is.close()

            String newEntryName = entry.name
            byte[] entryBytes = bytes

            if (entry.name.endsWith(".class") && entry.name.startsWith(pkgPrefix)) {
                String internalName = entry.name.replace(".class", "")
                try {
                    ClassReader reader = new ClassReader(bytes)
                    ClassNode node = new ClassNode()
                    reader.accept(node, ClassReader.EXPAND_FRAMES)

                    for (MethodNode method : node.methods) {
                        if (dontObfMethods.contains(internalName + "." + method.name + method.desc) || dontObfClasses.contains(internalName)) continue

                        if (method.localVariables != null && method.localVariables.size() > 0) {
                            int paramIndex = ((method.access & Opcodes.ACC_STATIC) == 0) ? 1 : 0
                            for (int i = paramIndex; i < method.localVariables.size(); i++) {
                                LocalVariableNode lv = method.localVariables.get(i)
                                if (lv.name != "this") {
                                    lv.name = generateRandomParamName(random)
                                }
                            }
                        }
                    }

                    Random rnd = new Random(System.currentTimeMillis())
                    for (MethodNode method : node.methods) {
                        injectGarbageScattered(method, rnd)
                        insertArtLines(node, method, rnd)
                    }
                    ensureClinitWithGarbage(node, rnd)

                    ClassWriter writer = new ClassWriter(ClassWriter.COMPUTE_FRAMES)
                    ClassRemapper classRemapper = new ClassRemapper(writer, remapper)
                    for (MethodNode m : node.methods) {
                        m.parameters = null
                        m.signature = null
                        m.access = m.access & ~Opcodes.ACC_SYNTHETIC
                        m.access = m.access & ~Opcodes.ACC_MANDATED
                    }
                    node.accept(classRemapper)

                    entryBytes = writer.toByteArray()
                    String newInternalName
                    if (classMapping.containsKey(internalName)) {
                        newInternalName = classMapping.get(internalName)
                    } else if (internalName.contains('$')) {
                        String outerClass = internalName.substring(0, internalName.indexOf('$'))
                        String innerPart = internalName.substring(internalName.indexOf('$'))
                        if (classMapping.containsKey(outerClass)) {
                            newInternalName = classMapping.get(outerClass) + innerPart
                        } else {
                            newInternalName = internalName
                        }
                    } else {
                        newInternalName = classMapping.containsKey(internalName) ? classMapping.get(internalName) : internalName
                    }
                    newEntryName = newInternalName + ".class"
                    println("ОБФУСКАЦИЯ: " + entry.name + " -> " + newEntryName)
                } catch (Exception e) {
                    println("ОШИБКА при обработке " + entry.name + ": " + e.getMessage())
                }
            }

            if (entry.name == "fabric.mod.json" || entry.name == "holymoderation.mixins.json" || entry.name == "HolyModeration-refmap.json") {
                try {
                    String content = new String(entryBytes, "UTF-8")
                    String updatedContent = content

                    String mixinPrefix = "me/yuugao/holymoderation/client/mixin"

                    List<Map.Entry<String, String>> mappingEntries = new ArrayList<>(classMapping.entrySet())
                    mappingEntries.sort { a, b -> b.key.length() <=> a.key.length() }

                    String newMixinDirSimple = null
                    if (classMapping.containsKey(mixinPrefix)) {
                        String mappedMixinDir = classMapping.get(mixinPrefix)
                        if (mappedMixinDir != null && mappedMixinDir.contains("/")) {
                            newMixinDirSimple = mappedMixinDir.substring(mappedMixinDir.lastIndexOf('/') + 1)
                        } else {
                            newMixinDirSimple = mappedMixinDir
                        }
                    }

                    for (Map.Entry<String, String> mapEntry : mappingEntries) {
                        String oldClass = mapEntry.key
                        String newClass = mapEntry.value

                        if (entry.name == "HolyModeration-refmap.json") {
                            updatedContent = updatedContent.replaceAll(Pattern.quote(oldClass), newClass)
                        } else {
                            String oldClassName = oldClass.replace("/", ".")
                            String newClassName = newClass.replace("/", ".")
                            updatedContent = updatedContent.replaceAll("\\b" + Pattern.quote(oldClassName) + "\\b", newClassName)
                        }

                        if (entry.name == "holymoderation.mixins.json" && oldClass.startsWith(mixinPrefix + "/")) {
                            String oldSimple = oldClass.substring(oldClass.lastIndexOf('/') + 1)
                            String newSimple = newClass.substring(newClass.lastIndexOf('/') + 1)
                            updatedContent = updatedContent.replace("\"" + oldSimple + "\"", "\"" + newSimple + "\"")
                        }
                    }

                    if (entry.name == "holymoderation.mixins.json" && newMixinDirSimple != null) {
                        updatedContent = updatedContent.replace("\"me.yuugao.holymoderation.client.mixin\"", "\"me.yuugao.holymoderation.client." + newMixinDirSimple + "\"")
                    }

                    entryBytes = updatedContent.getBytes("UTF-8")
                    println("ОБНОВЛЕН JSON: " + entry.name)
                } catch (Exception e) {
                    println("ОШИБКА при обновлении " + entry.name + ": " + e.getMessage())
                }
            }


            ZipEntry newEntry = new ZipEntry(newEntryName)
            newEntry.setTime(entry.time)
            tempJar.putNextEntry(newEntry)
            tempJar.write(entryBytes)
            tempJar.closeEntry()
        }

        jarFile.close()
        tempJar.close()

        File mappingFile = new File(inputJar.parentFile, "obfuscation-mapping.txt")
        mappingFile.text = "=== МАППИНГ КЛАССОВ ===\n"
        for (Map.Entry<String, String> e : classMapping.entrySet()) {
            mappingFile.append(e.key + " -> " + e.value + "\n")
        }
        mappingFile.append("\n=== МАППИНГ МЕТОДОВ ===\n")
        for (Map.Entry<String, String> e : methodMapping.entrySet()) {
            mappingFile.append(e.key + " -> " + e.value + "\n")
        }
        mappingFile.append("\n=== МАППИНГ ПОЛЕЙ ===\n")
        for (Map.Entry<String, String> e : fieldMapping.entrySet()) {
            mappingFile.append(e.key + " -> " + e.value + "\n")
        }
        mappingFile.append("\n=== МАППИНГ ПАРАМЕТРОВ ===\n")
        for (Map.Entry<String, String> e : paramMapping.entrySet()) {
            mappingFile.append(e.key + " -> " + e.value + "\n")
        }
        mappingFile.append("\n=== ИСКЛЮЧЕНИЯ @dontobf ===\n")
        mappingFile.append("Классы: " + dontObfClasses.join(", ") + "\n")
        mappingFile.append("Методы: " + dontObfMethods.join(", ") + "\n")
        mappingFile.append("Поля: " + dontObfFields.join(", ") + "\n")

        println("=== ОБФУСКАЦИЯ ЗАВЕРШЕНА ===")
        println("Обфусцированный JAR: " + outputJar.name)
        println("Маппинг сохранен в: " + mappingFile.name)
        println("Обработано классов: " + classMapping.size())
        println("Обработано методов: " + methodMapping.size())
        println("Обработано полей: " + fieldMapping.size())
    }
}

tasks.register("buildObfuscated") {
    group = "build"
    description = "Собирает обычную и обфусцированную версии мода"

    dependsOn build
    finalizedBy obfuscateJar

    doLast {
        println("=== СБОРКА ЗАВЕРШЕНА ===")
        println("Обычный JAR: " + remapJar.archiveFile.get().asFile.name)
        File obfJar = new File(remapJar.archiveFile.get().asFile.parentFile, remapJar.archiveFile.get().asFile.name.replace(".jar", "") + "-obfuscated.jar")
        println("Обфусцированный JAR: " + obfJar.name)
    }
}

obfuscateJar.mustRunAfter build

static def generateRandomPackageName(Random random) {
    String chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
    int length = 16 + random.nextInt(16)
    StringBuilder name = new StringBuilder()
    for (int i = 0; i < length; i++) {
        name.append(chars.charAt(random.nextInt(chars.length())))
    }
    return name.toString()
}

static def generateRandomClassName(Random random) {
    String chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
    int length = 16 + random.nextInt(16)
    StringBuilder name = new StringBuilder()
    for (int i = 0; i < length; i++) {
        name.append(chars.charAt(random.nextInt(chars.length())))
    }
    return name.toString()
}

static def generateRandomMethodName(Random random) {
    String chars = "的一是在不了有和人這中大為上個國我以要他時來用們生到作地於出就分對成會可主發年動同工也能下過子說產種面而方後多定行學法所民得經十三之進等部度家電力裡如水化高自二理起小物實加量都兩體制機當使點從業本去把性好應開它合還因由其些然前外天政四日那社義事平形相全表間樣與關各重新線內數正心反你明看原又麼利比或但質氣第向道命此變條只沒結解問意建月公無系軍很情者最立代想已通並提直題黨程展五果料象員革位入常文總次品式活設及管特件長求老頭基資邊流路級少圖山統接知較將組見計別她手角期根論運農指幾九區強放決西被做必戰先回則任取據處隊南給色光門即保治北造百規熱領七海口東導器壓志世金增張於細平"
    int length = 16 + random.nextInt(16)
    StringBuilder name = new StringBuilder()
    for (int i = 0; i < length; i++) {
        name.append(chars.charAt(random.nextInt(chars.length())))
    }
    return name.toString()
}

static def generateRandomFieldName(Random random) {
