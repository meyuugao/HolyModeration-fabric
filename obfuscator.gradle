buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.ow2.asm:asm:9.5'
        classpath 'org.ow2.asm:asm-commons:9.5'
        classpath 'org.ow2.asm:asm-tree:9.5'
        classpath 'com.google.code.gson:gson:2.10.1'
    }
}


import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.Opcodes
import org.objectweb.asm.commons.ClassRemapper
import org.objectweb.asm.commons.Remapper
import org.objectweb.asm.tree.ClassNode
import org.objectweb.asm.tree.FieldNode
import org.objectweb.asm.tree.LocalVariableNode
import org.objectweb.asm.tree.MethodNode

import java.util.jar.JarFile
import java.util.jar.JarOutputStream
import java.util.zip.ZipEntry

task obfuscateJar {
    dependsOn remapJar
    group = 'build'
    description = 'Создает обфусцированную версию JAR файла'

    doLast {
        def inputJar = remapJar.archiveFile.get().asFile
        def outputJar = new File(inputJar.parent, "${inputJar.name.replace('.jar', '')}-obfuscated.jar")

        println "=== НАЧАЛО ОБФУСКАЦИИ ==="
        println "Входной файл: ${inputJar.name}"
        println "Выходной файл: ${outputJar.name}"

        def classMapping = [:]
        def methodMapping = [:]
        def fieldMapping = [:]
        def paramMapping = [:]
        def dontObfClasses = [] as Set
        def dontObfMethods = [] as Set
        def dontObfFields = [] as Set
        def random = new Random(42)

        def originalJar = new JarFile(inputJar)
        def classData = [:]

        originalJar.entries().each { entry ->
            if (entry.name.endsWith('.class') && entry.name.startsWith('me/yuugao/holymoderation/')) {

                def is = originalJar.getInputStream(entry)
                def bytes = is.bytes
                is.close()

                def internalName = entry.name.replace('.class', '')
                classData[internalName] = bytes

                def reader = new ClassReader(bytes)
                def node = new ClassNode()
                reader.accept(node, ClassReader.EXPAND_FRAMES)

                def hasClassDontObf = node.visibleAnnotations?.any {
                    it.desc == 'Lme/yuugao/holymoderation/client/obfuscation/DontObf;'
                } ?: false

                if (hasClassDontObf) {
                    dontObfClasses.add(internalName)
                    println "КЛАСС С @dontobf: ${internalName}"
                }

                if (!entry.name.contains('$')) {
                    def packageName = internalName.substring(0, internalName.lastIndexOf('/'))
                    def simpleClassName = internalName.substring(internalName.lastIndexOf('/') + 1)
                    def randomName = generateRandomClassName(random)
                    def newInternalName = "${packageName}/${randomName}"

                    classMapping[internalName] = newInternalName
                    println "КЛАСС: ${internalName} -> ${newInternalName}"
                }

                node.methods.each { MethodNode method ->
                    def methodKey = "${method.name}${method.desc}"
                    def hasMethodDontObf = method.visibleAnnotations?.any {
                        it.desc == 'Lme/yuugao/holymoderation/client/obfuscation/DontObf;'
                    } ?: false

                    if (hasMethodDontObf) {
                        dontObfMethods.add(methodKey)
                        println "МЕТОД С @dontobf: ${internalName}.${method.name}${method.desc}"
                    }

                    if (!hasMethodDontObf && method.name != '<init>' && method.name != '<clinit>' && !hasClassDontObf) {

                        if (!methodMapping.containsKey(method.name)) {
                            methodMapping[method.name] = generateRandomMethodName(random)
                            println "НОВЫЙ МЕТОД: ${method.name} -> ${methodMapping[method.name]}"
                        }
                    }
                }

                node.fields.each { FieldNode field ->
                    def hasFieldDontObf = field.visibleAnnotations?.any {
                        it.desc == 'Lme/yuugao/holymoderation/client/obfuscation/DontObf;'
                    } ?: false

                    if (hasFieldDontObf) {
                        dontObfFields.add("${internalName}.${field.name}")
                        println "ПОЛЕ С @dontobf: ${internalName}.${field.name}"
                    }

                    if (!hasFieldDontObf && !hasClassDontObf) {
                        if (!fieldMapping.containsKey(field.name)) {
                            fieldMapping[field.name] = generateRandomFieldName(random)
                            println "НОВОЕ ПОЛЕ: ${field.name} -> ${fieldMapping[field.name]}"
                        }
                    }
                }

                // Generate parameter mappings
                node.methods.each { MethodNode method ->
                    def methodKey = "${method.name}${method.desc}"
                    def hasMethodDontObf = method.visibleAnnotations?.any {
                        it.desc == 'Lme/yuugao/holymoderation/client/obfuscation/DontObf;'
                    } ?: false

                    if (!hasMethodDontObf && !hasClassDontObf) {
                        def methodDesc = method.desc
                        def paramTypes = parseMethodDescriptor(methodDesc)

                        if (paramTypes && paramTypes.size() > 0 && method.localVariables) {
                            def paramIndex = 0
                            if ((method.access & Opcodes.ACC_STATIC) == 0) {
                                paramIndex = 1 // Skip 'this' parameter for non-static methods
                            }

                            method.localVariables.each { LocalVariableNode localVar ->
                                if (localVar.index >= paramIndex && localVar.index < paramIndex + paramTypes.size()) {
                                    def obfuscatedClassName = classMapping.getOrDefault(internalName, internalName)
                                    def obfuscatedMethodName = methodMapping.getOrDefault(method.name, method.name)
                                    def paramKey = "${obfuscatedClassName}.${obfuscatedMethodName}.${localVar.index - paramIndex}"
                                    if (!paramMapping.containsKey(paramKey)) {
                                        def newParamName = generateRandomParamName(random)
                                        paramMapping[paramKey] = newParamName
                                        println "НОВЫЙ АРГУМЕНТ: ${obfuscatedMethodName} ${localVar.name} -> ${newParamName}"
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }


        originalJar.close()

        println "Сгенерировано маппингов классов: ${classMapping.size()}"
        println "Сгенерировано маппингов методов: ${methodMapping.size()}"
        println "Сгенерировано маппингов полей: ${fieldMapping.size()}"
        println "Сгенерировано маппингов параметров: ${paramMapping.size()}"
        println "Классов с @dontobf: ${dontObfClasses.size()}"
        println "Методов с @dontobf: ${dontObfMethods.size()}"
        println "Полей с @dontobf: ${dontObfFields.size()}"

        def remapper = new Remapper() {
            @Override
            String map(String internalName) {
                return classMapping.getOrDefault(internalName, internalName)
            }

            @Override
            String mapMethodName(String owner, String name, String descriptor) {
                if (!owner.startsWith('me/yuugao/holymoderation/')) {
                    return name
                }

                def externalLibraries = ['com/google/gson/',
                                         'java/lang/',
                                         'java/util/',
                                         'java/io/',
                                         'java/net/',
                                         'javax/net/ssl/',
                                         'org/jetbrains/annotations/',
                                         'org/objectweb/asm/']

                for (lib in externalLibraries) {
                    if (owner.startsWith(lib)) {
                        return name
                    }
                }

                def isAnonymousClass = !owner.contains('/') || owner.startsWith('[')

                if (isAnonymousClass) {
                    return name
                }

                def isAnonymousFromExternalLib = false
                if (owner.contains('$')) {
                    def classBytes = classData[owner]
                    if (classBytes) {
                        try {
                            def reader = new ClassReader(classBytes)
                            def superClassInternalName = reader.getSuperName()

                            if (superClassInternalName && (superClassInternalName.startsWith('com/google/gson/') || superClassInternalName.startsWith('java/lang/') || superClassInternalName.startsWith('java/util/') || superClassInternalName.startsWith('java/io/') || superClassInternalName.startsWith('java/net/') || superClassInternalName.startsWith('javax/') || superClassInternalName.startsWith('org/jetbrains/') || superClassInternalName.startsWith('org/objectweb/'))) {
                                isAnonymousFromExternalLib = true
                            }
                        } catch (Exception e) {
                        }
                    }
                }

                if (isAnonymousFromExternalLib) {
                    return name
                }

                def methodKey = "${name}${descriptor}"
                if (dontObfMethods.contains(methodKey)) {
                    return name
                }

                if (dontObfClasses.contains(owner)) {
                    return name
                }

                return methodMapping.getOrDefault(name, name)
            }

            @Override
            String mapFieldName(String owner, String name, String descriptor) {
                if (!owner.startsWith('me/yuugao/holymoderation/')) {
                    return name
                }

                def fieldKey = "${owner}.${name}"
                if (dontObfFields.contains(fieldKey)) {
                    return name
                }

                if (dontObfClasses.contains(owner)) {
                    return name
                }

                return fieldMapping.getOrDefault(name, name)
            }

            String mapLocalVariableName(String owner, String thisName, String name, String descriptor, int index) {
                if (!owner.startsWith('me/yuugao/holymoderation/')) {
                    return name
                }

                def classNode = classData[owner]?.let { bytes ->
                    def reader = new ClassReader(bytes)
                    def node = new ClassNode()
                    reader.accept(node, ClassReader.EXPAND_FRAMES)
                    node
                }

                if (!classNode) {
                    return name
                }

                for (method in classNode.methods) {
                    def methodDesc = method.desc
                    def paramTypes = parseMethodDescriptor(methodDesc)

                    if (paramTypes && paramTypes.size() > 0 && method.localVariables) {
                        def paramIndex = 0
                        if ((method.access & Opcodes.ACC_STATIC) == 0) {
                            paramIndex = 1
                        }

                        for (localVar in method.localVariables) {
                            if (localVar.index == index) {
                                def obfuscatedClassName = classMapping.getOrDefault(owner, owner)
                                def obfuscatedMethodName = methodMapping.getOrDefault(method.name, method.name)
                                def paramKey = "${obfuscatedClassName}.${obfuscatedMethodName}.${index - paramIndex}"
                                if (paramMapping.containsKey(paramKey)) {
                                    return paramMapping[paramKey]
                                }
                                break
                            }
                        }
                    }
                }

                return name
            }
        }

        def tempJar = new JarOutputStream(new FileOutputStream(outputJar))
        def jarFile = new JarFile(inputJar)

        jarFile.entries().each { entry ->
            def is = jarFile.getInputStream(entry)
            def bytes = is.bytes
            is.close()

            def newEntryName = entry.name
            def entryBytes = bytes

            if (entry.name.endsWith('.class') && entry.name.startsWith('me/yuugao/holymoderation/')) {

                def internalName = entry.name.replace('.class', '')

                try {
                    def reader = new ClassReader(bytes)
                    def node = new ClassNode()
                    reader.accept(node, ClassReader.EXPAND_FRAMES)

                    // Apply parameter obfuscation
                    node.methods.each { MethodNode method ->
                        def methodKey = "${method.name}${method.desc}"
                        def hasMethodDontObf = method.visibleAnnotations?.any {
                            it.desc == 'Lme/yuugao/holymoderation/client/obfuscation/DontObf;'
                        } ?: false

                        if (!hasMethodDontObf && !dontObfClasses.contains(internalName)) {
                            def methodDesc = method.desc
                            def paramTypes = parseMethodDescriptor(methodDesc)

                            if (paramTypes && paramTypes.size() > 0 && method.localVariables) {
                                def paramIndex = 0
                                if ((method.access & Opcodes.ACC_STATIC) == 0) {
                                    paramIndex = 1 // Skip 'this' parameter for non-static methods
                                }

                                method.localVariables.each { LocalVariableNode localVar ->
                                    println "ОБРАБОТКА ЛОКАЛЬНОЙ ПЕРЕМЕННОЙ: ${localVar.name} (индекс: ${localVar.index})"
                                    if (localVar.index >= paramIndex && localVar.index < paramIndex + paramTypes.size()) {
                                        def obfuscatedClassName = classMapping.getOrDefault(internalName, internalName)
                                        def obfuscatedMethodName = methodMapping.getOrDefault(method.name, method.name)
                                        def paramKey = "${obfuscatedClassName}.${obfuscatedMethodName}.${localVar.index - paramIndex}".intern() //tip: ВАЖНО: ПРЕОБРАЗОВАНИЕ GStringImpl (интерполированная строка) --> String
                                        println "ПРОВЕРКА МАППИНГА ДЛЯ: ${paramKey} (доступно: ${paramMapping.containsKey(paramKey)})"
                                        if (paramMapping.containsKey(paramKey)) {
                                            def oldParamName = localVar.name
                                            def newParamName = paramMapping.get(paramKey)
                                            println "ОБФУСКАЦИЯ ПАРАМЕТРА: ${obfuscatedClassName}.${obfuscatedMethodName} ${oldParamName} -> ${newParamName}"
                                            localVar.name = newParamName
                                        } else {
                                            println "НЕТ МАППИНГА ДЛЯ: ${paramKey}"
                                        }
                                    } else {
                                        println "ПАРАМЕТР ВНЕ ДИАПАЗОНА: ${localVar.index} (диапазон: ${paramIndex}..${paramIndex + paramTypes.size() - 1})"
                                    }
                                }
                            }
                        }
                    }

                    def writer = new ClassWriter(ClassWriter.COMPUTE_FRAMES)
                    def classRemapper = new ClassRemapper(writer, remapper)
                    node.methods.each { MethodNode m ->
                        m.parameters = null
                        m.signature = null
                        m.access &= ~Opcodes.ACC_SYNTHETIC
                        m.access &= ~Opcodes.ACC_MANDATED
                    }
                    node.accept(classRemapper)

                    entryBytes = writer.toByteArray()

                    def newInternalName = classMapping.getOrDefault(internalName, internalName)
                    newEntryName = newInternalName + '.class'

                    println "ОБФУСКАЦИЯ: ${entry.name} -> ${newEntryName}"

                } catch (Exception e) {
                    println "ОШИБКА при обработке ${entry.name}: ${e.message}"
                }
            } else {
                newEntryName = entry.name
            }

            if (entry.name in ['fabric.mod.json', 'holymoderation.mixins.json', 'HolyModeration-refmap.json']) {
                try {
                    def content = new String(bytes, 'UTF-8')
                    def updatedContent = content

                    classMapping.each { oldClass, newClass ->
                        def oldClassName = oldClass.replace('/', '.')
                        def newClassName = newClass.replace('/', '.')
                        def oldSimpleName = oldClass.substring(oldClass.lastIndexOf('/') + 1)
                        def newSimpleName = newClass.substring(newClass.lastIndexOf('/') + 1)

                        if (entry.name == 'HolyModeration-refmap.json') {
                            updatedContent = updatedContent.replaceAll(oldClass, newClass)
                        } else {
                            updatedContent = updatedContent.replaceAll(oldClassName, newClassName)
                        }

                        if (entry.name == 'holymoderation.mixins.json') {
                            updatedContent = updatedContent.replaceAll("\"${oldSimpleName}\"", "\"${newSimpleName}\"")
                        }
                    }

                    entryBytes = updatedContent.getBytes('UTF-8')
                    println "ОБНОВЛЕН JSON: ${entry.name}"

                } catch (Exception e) {
                    println "ОШИБКА при обновлении ${entry.name}: ${e.message}"
                }
            }

            def newEntry = new ZipEntry(newEntryName)
            newEntry.setTime(entry.time)
            tempJar.putNextEntry(newEntry)
            tempJar.write(entryBytes)
            tempJar.closeEntry()
        }

        jarFile.close()
        tempJar.close()

        def mappingFile = new File(inputJar.parent, "obfuscation-mapping.txt")
        mappingFile.text = "=== МАППИНГ КЛАССОВ ===\n"
        classMapping.each { oldClass, newClass -> mappingFile.append("${oldClass} -> ${newClass}\n")
        }

        mappingFile.append("\n=== МАППИНГ МЕТОДОВ ===\n")
        methodMapping.each { oldMethod, newMethod -> mappingFile.append("${oldMethod} -> ${newMethod}\n")
        }

        mappingFile.append("\n=== МАППИНГ ПОЛЕЙ ===\n")
        fieldMapping.each { oldField, newField -> mappingFile.append("${oldField} -> ${newField}\n")
        }

        mappingFile.append("\n=== МАППИНГ ПАРАМЕТРОВ ===\n")
        paramMapping.each { paramKey, newParamName -> mappingFile.append("${paramKey} -> ${newParamName}\n")
        }

        mappingFile.append("\n=== ИСКЛЮЧЕНИЯ @dontobf ===\n")
        mappingFile.append("Классы: ${dontObfClasses.join(', ')}\n")
        mappingFile.append("Методы: ${dontObfMethods.join(', ')}\n")
        mappingFile.append("Поля: ${dontObfFields.join(', ')}\n")

        println "=== ОБФУСКАЦИЯ ЗАВЕРШЕНА ==="
        println "Обфусцированный JAR: ${outputJar.name}"
        println "Маппинг сохранен в: ${mappingFile.name}"
        println "Обработано классов: ${classMapping.size()}"
        println "Обработано методов: ${methodMapping.size()}"
        println "Обработано полей: ${fieldMapping.size()}"
    }
}


task buildObfuscated {
    group = 'build'
    description = 'Собирает обычную и обфусцированную версии мода'

    dependsOn build
    finalizedBy obfuscateJar

    doLast {
        println "=== СБОРКА ЗАВЕРШЕНА ==="
        println "Обычный JAR: ${remapJar.archiveFile.get().asFile.name}"
        def obfuscatedJar = new File(remapJar.archiveFile.get().asFile.parent, "${remapJar.archiveFile.get().asFile.name.replace('.jar', '')}-obfuscated.jar")
        println "Обфусцированный JAR: ${obfuscatedJar.name}"
    }
}

obfuscateJar.mustRunAfter build

def generateRandomClassName(Random random) {
    def chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
    def length = 16 + random.nextInt(16)
    def name = ""

    for (int i = 0; i < length; i++) {
        name += chars.charAt(random.nextInt(chars.length()))
    }

    return name
}

def generateRandomMethodName(Random random) {
    def chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
    def length = 8 + random.nextInt(8)
    def name = ""

    for (int i = 0; i < length; i++) {
        name += chars.charAt(random.nextInt(chars.length()))
    }

    return name
}

def generateRandomFieldName(Random random) {
    def chars = "abcdefghijklmnopqrstuvwxyz"
    def length = 6 + random.nextInt(10)
    def name = ""

    for (int i = 0; i < length; i++) {
        name += chars.charAt(random.nextInt(chars.length()))
    }

    return name
}

def generateRandomParamName(Random random) {
    def chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
    def length = 12 + random.nextInt(12)
    def name = ""

    for (int i = 0; i < length; i++) {
        name += chars.charAt(random.nextInt(chars.length()))
    }

    return name
}

def parseMethodDescriptor(String descriptor) {
    if (!descriptor || descriptor.length() < 3 || descriptor[0] != '(') {
        return null
    }

    def paramTypes = []
    def i = 1 // Skip '('

    while (i < descriptor.length() && descriptor[i] != ')') {
        def type = descriptor[i]

        if (type == 'L') {
            // Object type
            def end = descriptor.indexOf(';', i)
            if (end == -1) {
                return null
            }
            paramTypes.add(descriptor.substring(i, end + 1))
            i = end + 1
        } else if (type == '[') {
            // Array type
            def end = i + 1
            while (end < descriptor.length() && descriptor[end] == '[') {
                end++
            }
            if (end >= descriptor.length()) {
                return null
            }
            if (descriptor[end] == 'L') {
                def semiEnd = descriptor.indexOf(';', end)
                if (semiEnd == -1) {
                    return null
                }
                paramTypes.add(descriptor.substring(i, semiEnd + 1))
                i = semiEnd + 1
            } else {
                paramTypes.add(descriptor.substring(i, end + 1))
                i = end + 1
            }
        } else {
            // Primitive type
            paramTypes.add(type)
            i++
        }
    }

    return paramTypes
}