static def parseMethodDescriptor(String descriptor) {
    if (descriptor == null || descriptor.length() < 3 || descriptor.charAt(0).toString() != "(") {
        return null
    }
    List<String> paramTypes = new ArrayList<>()
    int i = 1
    while (i < descriptor.length() && descriptor.charAt(i).toString() != ")") {
        String type = descriptor.charAt(i).toString()
        if (type == "L") {
            int end = descriptor.indexOf(";", i)
            if (end == -1) return null
            paramTypes.add(descriptor.substring(i, end + 1))
            i = end + 1
        } else if (type == "[") {
            int end = i + 1
            while (end < descriptor.length() && descriptor.charAt(end).toString() == "[") end++
            if (end >= descriptor.length()) return null
            if (descriptor.charAt(end).toString() == "L") {
                int semiEnd = descriptor.indexOf(";", end)
                if (semiEnd == -1) return null
                paramTypes.add(descriptor.substring(i, semiEnd + 1))
                i = semiEnd + 1
            } else {
                paramTypes.add(descriptor.substring(i, end + 1))
                i = end + 1
            }
        } else {
            paramTypes.add(String.valueOf(type))
            i++
        }
    }
    return paramTypes
}

static def injectGarbageScattered(MethodNode methodNode, Random rnd) {
    if ((methodNode.access & Opcodes.ACC_ABSTRACT) != 0) return
    if ((methodNode.access & Opcodes.ACC_NATIVE) != 0) return
    if ("<init>" == methodNode.name) return

    InsnList insns = new InsnList()
    int localIndex = methodNode.maxLocals
    int blocks = 8 + rnd.nextInt(8)
    for (int b = 0; b < blocks; b++) {
        LabelNode skip = new LabelNode()
        insns.add(new InsnNode(Opcodes.ICONST_0))
        insns.add(new JumpInsnNode(Opcodes.IFEQ, skip))
        int ops = 6 + rnd.nextInt(20)
        for (int o = 0; o < ops; o++) {
            int kind = rnd.nextInt(4)
            if (kind == 0) {
                int val = rnd.nextInt()
                insns.add(new LdcInsnNode(val))
                insns.add(new VarInsnNode(Opcodes.ISTORE, localIndex))
                insns.add(new VarInsnNode(Opcodes.ILOAD, localIndex))
                int val2 = rnd.nextInt(1000) + 1
                insns.add(new LdcInsnNode(val2))
                insns.add(new InsnNode(Opcodes.IMUL))
                insns.add(new VarInsnNode(Opcodes.ISTORE, localIndex))
                localIndex++
            } else if (kind == 1) {
                long lval = Math.abs(rnd.nextLong())
                insns.add(new LdcInsnNode(lval))
                insns.add(new VarInsnNode(Opcodes.LSTORE, localIndex))
                insns.add(new VarInsnNode(Opcodes.LLOAD, localIndex))
                insns.add(new LdcInsnNode(rnd.nextLong()))
                insns.add(new InsnNode(Opcodes.LXOR))
                insns.add(new VarInsnNode(Opcodes.LSTORE, localIndex))
                localIndex += 2
            } else if (kind == 2) {
                String s = randomChinese(rnd, 6 + rnd.nextInt(10))
                insns.add(new LdcInsnNode(s))
                insns.add(new VarInsnNode(Opcodes.ASTORE, localIndex))
                insns.add(new VarInsnNode(Opcodes.ALOAD, localIndex))
                insns.add(new InsnNode(Opcodes.POP))
                localIndex++
            } else {
                double d = rnd.nextDouble() * rnd.nextInt(Integer.MAX_VALUE)
                insns.add(new LdcInsnNode(d))
                insns.add(new VarInsnNode(Opcodes.DSTORE, localIndex))
                insns.add(new VarInsnNode(Opcodes.DLOAD, localIndex))
                insns.add(new LdcInsnNode(rnd.nextDouble()))
                insns.add(new InsnNode(Opcodes.DADD))
                insns.add(new VarInsnNode(Opcodes.DSTORE, localIndex))
                localIndex += 2
            }
        }
        insns.add(skip)
    }

    methodNode.maxLocals = Math.max(methodNode.maxLocals, localIndex)

    if (methodNode.instructions == null || methodNode.instructions.size() == 0) {
        methodNode.instructions = insns
        methodNode.instructions.add(new InsnNode(Opcodes.RETURN))
    } else {
        methodNode.instructions.insert(insns)
    }
}

