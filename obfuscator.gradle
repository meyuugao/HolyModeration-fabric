buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.ow2.asm:asm:9.5'
        classpath 'org.ow2.asm:asm-commons:9.5'
        classpath 'org.ow2.asm:asm-tree:9.5'
        classpath 'com.google.code.gson:gson:2.10.1'
    }
}

import org.objectweb.asm.*
import org.objectweb.asm.commons.ClassRemapper
import org.objectweb.asm.commons.Remapper
import org.objectweb.asm.tree.*
import java.util.jar.JarFile
import java.util.jar.JarOutputStream
import java.util.zip.ZipEntry
import com.google.gson.Gson
import com.google.gson.JsonObject
import com.google.gson.JsonArray
import com.google.gson.JsonElement

// Задача для обфускации JAR файла
task obfuscateJar {
    dependsOn remapJar
    group = 'build'
    description = 'Создает обфусцированную версию JAR файла'

    doLast {
        def inputJar = remapJar.archiveFile.get().asFile
        def outputJar = new File(inputJar.parent, "${inputJar.name.replace('.jar', '')}-obfuscated.jar")
        
        println "=== НАЧАЛО ОБФУСКАЦИИ ==="
        println "Входной файл: ${inputJar.name}"
        println "Выходной файл: ${outputJar.name}"
        
        // Шаг 1: Генерируем маппинг классов и методов
        def classMapping = [:] // старый класс -> новый класс
        def methodMapping = [:] // старое имя метода -> новое имя метода
        def fieldMapping = [:] // старое имя поля -> новое имя поля
        def random = new Random(42) // фиксированный seed для воспроизводимости
        
        // Читаем все классы из JAR для генерации маппинга
        def originalJar = new JarFile(inputJar)
        def allMethods = [] as Set<String> // собираем все уникальные имена методов
        def excludedMethods = [] as Set<String> // методы, которые не нужно обфусцировать
        def allFields = [] as Set<String> // собираем все уникальные имена полей
        def excludedFields = [] as Set<String> // поля, которые не нужно обфусцировать
        def excludedClasses = [] as Set<String> // классы, которые не нужно обфусцировать
        
        // Сначала собираем все имена методов и полей и определяем, какие исключить
        originalJar.entries().each { entry ->
            if (entry.name.endsWith('.class') && 
                entry.name.startsWith('me/yuugao/holymoderation/')) {
                
                def is = originalJar.getInputStream(entry)
                def bytes = is.bytes
                is.close()
                
                try {
                    def reader = new ClassReader(bytes)
                    def node = new ClassNode()
                    reader.accept(node, ClassReader.SKIP_FRAMES)
                    
                    // Проверяем, есть ли у класса аннотация @DontObf
                    def classHasDontObf = node.visibleAnnotations?.any { 
                        it.desc.equals('Lme/yuugao/holymoderation/client/obfuscation/DontObf;') 
                    }
                    
                    if (classHasDontObf) {
                        excludedClasses.add(entry.name.replace('.class', ''))
                        println "ИСКЛЮЧЕН КЛАСС: ${entry.name.replace('.class', '')} (имеет аннотацию @DontObf)"
                        return // пропускаем этот класс полностью
                    }
                    
                    // Собираем все имена методов и проверяем аннотации
                    node.methods.each { method ->
                        if (method.name != '<init>' && method.name != '<clinit>') {
                            // Проверяем, есть ли аннотация @DontObf
                            def hasDontObf = method.visibleAnnotations?.any { 
                                it.desc.equals('Lme/yuugao/holymoderation/client/obfuscation/DontObf;') 
                            }
                            
                            if (hasDontObf) {
                                excludedMethods.add(method.name)
                                println "ИСКЛЮЧЕН МЕТОД: ${method.name} (имеет аннотацию @DontObf)"
                            } else {
                                allMethods.add(method.name)
                            }
                        }
                    }
                    
                    // Собираем все имена полей и проверяем аннотации
                    node.fields.each { field ->
                        // Проверяем, есть ли аннотация @DontObf
                        def hasDontObf = field.visibleAnnotations?.any { 
                            it.desc.equals('Lme/yuugao/holymoderation/client/obfuscation/DontObf;') 
                        }
                        
                        if (hasDontObf) {
                            excludedFields.add(field.name)
                            println "ИСКЛЮЧЕН ПОЛЕ: ${field.name} (имеет аннотацию @DontObf)"
                        } else {
                            allFields.add(field.name)
                        }
                    }
                } catch (Exception e) {
                    println "ОШИБКА при чтении из ${entry.name}: ${e.message}"
                }
            }
        }
        
        // Генерируем маппинг для методов (только для тех, что не исключены)
        allMethods.each { methodName ->
            if (!excludedMethods.contains(methodName)) {
                def obfName = generateRandomMethodName(random)
                methodMapping[methodName] = obfName
                println "МЕТОД: ${methodName} -> ${obfName}"
            } else {
                println "ПРОПУЩЕН МЕТОД: ${methodName} (исключен из обфускации)"
            }
        }
        
        // Генерируем маппинг для полей (только для тех, что не исключены)
        allFields.each { fieldName ->
            if (!excludedFields.contains(fieldName)) {
                def obfName = generateRandomFieldName(random)
                fieldMapping[fieldName] = obfName
                println "ПОЛЕ: ${fieldName} -> ${obfName}"
            } else {
                println "ПРОПУЩЕН ПОЛЕ: ${fieldName} (исключено из обфускации)"
            }
        }
        
        // Генерируем маппинг для классов
        originalJar.entries().each { entry ->
            if (entry.name.endsWith('.class') && 
                entry.name.startsWith('me/yuugao/holymoderation/') &&
                !entry.name.contains('$')) { // исключаем внутренние классы
                
                def internalName = entry.name.replace('.class', '')
                
                if (!excludedClasses.contains(internalName)) {
                    // Генерируем случайное имя класса
                    def packageName = internalName.substring(0, internalName.lastIndexOf('/'))
                    def simpleClassName = internalName.substring(internalName.lastIndexOf('/') + 1)
                    def randomName = generateRandomClassName(random)
                    def newInternalName = "${packageName}/${randomName}"
                    
                    classMapping[internalName] = newInternalName
                    println "КЛАСС: ${internalName} -> ${newInternalName}"
                } else {
                    println "ПРОПУЩЕН КЛАСС: ${internalName} (исключен из обфускации)"
                }
            }
        }
        originalJar.close()
        
        println "Сгенерировано маппингов классов: ${classMapping.size()}"
        println "Сгенерировано маппингов методов: ${methodMapping.size()}"
        println "Сгенерировано маппингов полей: ${fieldMapping.size()}"
        println "Исключено классов из обфускации: ${excludedClasses.size()}"
        println "Исключено методов из обфускации: ${excludedMethods.size()}"
        println "Исключено полей из обфускации: ${excludedFields.size()}"
        
        // Шаг 2: Создаем remapper для ASM
        def remapper = new Remapper() {
            @Override
            String map(String internalName) {
                return classMapping.getOrDefault(internalName, internalName)
            }
            
            @Override
            String mapMethodName(String owner, String name, String descriptor) {
                // Обфусцируем методы из нашего пакета, только если они не исключены
                if (owner.startsWith('me/yuugao/holymoderation/') && methodMapping.containsKey(name)) {
                    return methodMapping.get(name)
                }
                return name
            }
            
            @Override
            String mapFieldName(String owner, String name, String descriptor) {
                // Обфусцируем поля из нашего пакета, только если они не исключены
                if (owner.startsWith('me/yuugao/holymoderation/') && fieldMapping.containsKey(name)) {
                    return fieldMapping.get(name)
                }
                return name
            }
        }
        
        // Шаг 3: Обрабатываем классы и создаем новую JAR
        def tempJar = new JarOutputStream(new FileOutputStream(outputJar))
        def jarFile = new JarFile(inputJar)
        
        jarFile.entries().each { entry ->
            def is = jarFile.getInputStream(entry)
            def bytes = is.bytes
            is.close()
            
            def newEntryName = entry.name
            def entryBytes = bytes
            
            // Если это класс из нашего пакета - обфусцируем его
            if (entry.name.endsWith('.class') && 
                entry.name.startsWith('me/yuugao/holymoderation/')) {
                
                def internalName = entry.name.replace('.class', '')
                
                if (!excludedClasses.contains(internalName)) {
                    try {
                        def reader = new ClassReader(bytes)
                        def node = new ClassNode()
                        reader.accept(node, ClassReader.EXPAND_FRAMES)
                        
                        // Применяем remapper
                        def writer = new ClassWriter(ClassWriter.COMPUTE_MAXS)
                        def classRemapper = new ClassRemapper(writer, remapper)
                        node.accept(classRemapper)
                        
                        entryBytes = writer.toByteArray()
                        
                        // Обновляем имя файла
                        def newInternalName = classMapping.getOrDefault(internalName, internalName)
                        newEntryName = newInternalName + '.class'
                        
                        println "ОБФУСКАЦИЯ: ${entry.name} -> ${newEntryName}"
                        
                    } catch (Exception e) {
                        println "ОШИБКА при обработке ${entry.name}: ${e.message}"
                        // Если ошибка, оставляем как есть
                    }
                } else {
                    println "ПРОПУЩЕН КЛАСС: ${entry.name} (исключен из обфускации)"
                }
            }
            
            // Если это JSON файл - обновляем ссылки на классы
            if (entry.name in ['fabric.mod.json', 'holymoderation.mixins.json', 'HolyModeration-refmap.json']) {
                try {
                    def content = new String(bytes, 'UTF-8')
                    def updatedContent = content
                    
                    // Заменяем все старые имена классов на новые через regex
                    classMapping.each { oldClass, newClass ->
                        def oldClassName = oldClass.replace('/', '.')
                        def newClassName = newClass.replace('/', '.')
                        def oldSimpleName = oldClass.substring(oldClass.lastIndexOf('/') + 1)
                        def newSimpleName = newClass.substring(newClass.lastIndexOf('/') + 1)
                        
                        // Для refmap.json используем слэши, для остальных - точки
                        if (entry.name == 'HolyModeration-refmap.json') {
                            // В refmap используем форматы со слэшами
                            updatedContent = updatedContent.replaceAll(oldClass, newClass)
                        } else {
                            // В остальных JSON используем точки
                            updatedContent = updatedContent.replaceAll(oldClassName, newClassName)
                        }
                        
                        // Для mixins.json заменяем только простые имена
                        if (entry.name == 'holymoderation.mixins.json') {
                            updatedContent = updatedContent.replaceAll("\"${oldSimpleName}\"", "\"${newSimpleName}\"")
                        }
                    }
                    
                    entryBytes = updatedContent.getBytes('UTF-8')
                    println "ОБНОВЛЕН JSON: ${entry.name}"
                    
                } catch (Exception e) {
                    println "ОШИБКА при обновлении ${entry.name}: ${e.message}"
                }
            }
            
            // Записываем entry в новую JAR
            def newEntry = new ZipEntry(newEntryName)
            newEntry.setTime(entry.time)
            tempJar.putNextEntry(newEntry)
            tempJar.write(entryBytes)
            tempJar.closeEntry()
        }
        
        jarFile.close()
        tempJar.close()
        
        // Шаг 4: Сохраняем маппинг в файл
        def mappingFile = new File(inputJar.parent, "obfuscation-mapping.txt")
        mappingFile.text = "=== МАППИНГ КЛАССОВ ===\n"
        classMapping.each { oldClass, newClass ->
            mappingFile.append("${oldClass} -> ${newClass}\n")
        }
        mappingFile.append("\n=== МАППИНГ МЕТОДОВ ===\n")
        methodMapping.each { oldMethod, newMethod ->
            mappingFile.append("${oldMethod} -> ${newMethod}\n")
        }
        mappingFile.append("\n=== МАППИНГ ПОЛЕЙ ===\n")
        fieldMapping.each { oldField, newField ->
            mappingFile.append("${oldField} -> ${newField}\n")
        }
        mappingFile.append("\n=== ИСКЛЮЧЕННЫЕ КЛАССЫ ===\n")
        excludedClasses.each { className ->
            mappingFile.append("${className} (исключен из обфускации)\n")
        }
        mappingFile.append("\n=== ИСКЛЮЧЕННЫЕ МЕТОДЫ ===\n")
        excludedMethods.each { methodName ->
            mappingFile.append("${methodName} (исключен из обфускации)\n")
        }
        mappingFile.append("\n=== ИСКЛЮЧЕННЫЕ ПОЛЯ ===\n")
        excludedFields.each { fieldName ->
            mappingFile.append("${fieldName} (исключено из обфускации)\n")
        }
        
        println "=== ОБФУСКАЦИЯ ЗАВЕРШЕНА ==="
        println "Обфусцированный JAR: ${outputJar.name}"
        println "Маппинг сохранен в: ${mappingFile.name}"
        println "Обработано классов: ${classMapping.size()}"
        println "Обработано методов: ${methodMapping.size()}"
        println "Обработано полей: ${fieldMapping.size()}"
        println "Исключено классов: ${excludedClasses.size()}"
        println "Исключено методов: ${excludedMethods.size()}"
        println "Исключено полей: ${excludedFields.size()}"
    }
}

// Вспомогательная функция для генерации случайных имен классов
def generateRandomClassName(Random random) {
    def chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
    def length = 16 + random.nextInt(16)
    def name = ""
    
    for (int i = 0; i < length; i++) {
        name += chars.charAt(random.nextInt(chars.length()))
    }
    
    return name
}

// Вспомогательная функция для генерации случайных имен методов
def generateRandomMethodName(Random random) {
    def chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
    def length = 8 + random.nextInt(8)
    def name = ""
    
    for (int i = 0; i < length; i++) {
        name += chars.charAt(random.nextInt(chars.length()))
    }
    
    return name
}

// Вспомогательная функция для генерации случайных имен полей
def generateRandomFieldName(Random random) {
    def chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
    def length = 6 + random.nextInt(6)
    def name = ""
    
    for (int i = 0; i < length; i++) {
        name += chars.charAt(random.nextInt(chars.length()))
    }
    
    return name
}

// Задача для сборки с обфускацией
task buildObfuscated {
    group = 'build'
    description = 'Собирает обычную и обфусцированную версии мода'
    
    dependsOn build
    finalizedBy obfuscateJar
    
    doLast {
        println "=== СБОРКА ЗАВЕРШЕНА ==="
        println "Обычный JAR: ${remapJar.archiveFile.get().asFile.name}"
        def obfuscatedJar = new File(remapJar.archiveFile.get().asFile.parent, "${remapJar.archiveFile.get().asFile.name.replace('.jar', '')}-obfuscated.jar")
        println "Обфусцированный JAR: ${obfuscatedJar.name}"
    }
}

// Устанавливаем порядок выполнения
obfuscateJar.mustRunAfter build
