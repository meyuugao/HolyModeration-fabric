                    "⢹⢽⣳⢯⠀⡇⡇⡆⠓⣗⡯⣇⢸⢽⣳⣌⠀⢯⣇⠹⡽⡌⢆⢳⣳⣻⣆⠘⣦⣪⠑⠕⣕⢕⢧⡫⡪⡪⣪⢳⢕⢝⢮⡪⡪⡪⡪⡳⡕⢜⢕⢧⢯⢮⡳⣄⠁⣊⡼⡳⡕⡌⢰⠸⡰⡰⡠⡉⠝⢮⢪⢪⢪⡂⠀⡠⠈⠛⢠⢑⠅⢕⠰⢐⢬⢾⡅⢃⣟⠞⣱⡏⠀⢀⣼⠳⡱⡠⠹⣽\n" +
                    "⠸⣽⣺⢽⡂⢜⢜⠸⡱⡠⠙⣗⠸⡽⡾⡾⣕⢸⣺⣆⠹⡽⣌⢆⢳⣳⢯⢷⣌⣊⣂⣦⣀⠁⠃⠏⠮⡮⡪⡳⡵⡵⣕⢝⢮⢮⢮⡳⡕⢱⢕⢝⠝⡝⡚⡚⠲⢌⢺⡚⢮⢪⠢⡣⡣⡣⡣⡣⡣⡣⡣⡣⡣⡣⠂⠪⡐⢅⠕⡐⠁⠁⡀⡈⠈⠉⣉⣀⢐⠙⣗⠁⡠⡞⠎⠢⡘⢜⢄⠸\n" +
                    "⠈⣞⣞⣟⡆⢸⢸⠈⡎⡎⡧⡄⡁⢫⢯⢯⢷⢔⣳⢯⢧⠙⡽⣮⢢⡹⡽⡽⣾⣞⣞⠎⡤⠢⠁⢄⢄⣈⠈⠈⠊⠪⠪⠳⢕⢕⢕⡝⡎⢬⡫⣇⢳⢕⢝⢮⡣⡣⡂⢽⣳⡳⢀⠁⠑⠑⠕⡵⣕⣕⡕⡕⡕⡕⠀⠕⠨⠀⢀⠄⠔⡁⡢⢘⢐⢀⠀⠫⡯⡯⣗⣖⡯⡧⣄⣄⡂⡠⠣⠣\n"
    ]

    Collections.shuffle(ARTS, rnd)

    for (int artIndex = 0; artIndex < ARTS.size(); artIndex++) {
        String ART = ARTS.get(artIndex)
        String[] lines = ART.split('\n')

        // создаём уникальное имя поля
        String fieldName
        int suffix = 0
        do {
            fieldName = "me_yuugaos_property_" + artIndex + "_" + suffix
            suffix++
        } while (classNode.fields.find { it.name == fieldName } != null)

        // добавляем поле только если ещё нет
        classNode.fields.add(
                new FieldNode(Opcodes.ACC_PRIVATE | Opcodes.ACC_STATIC, fieldName, "[Ljava/lang/String;", null, null)
        )

        InsnList insns = new InsnList()

        insns.add(new LdcInsnNode(lines.length))
        insns.add(new TypeInsnNode(Opcodes.ANEWARRAY, "java/lang/String"))
        insns.add(new FieldInsnNode(Opcodes.PUTSTATIC, classNode.name, fieldName, "[Ljava/lang/String;"))

        for (int i = 0; i < lines.length; i++) {
            insns.add(new FieldInsnNode(Opcodes.GETSTATIC, classNode.name, fieldName, "[Ljava/lang/String;"))
            insns.add(new LdcInsnNode(i))
            insns.add(new LdcInsnNode(lines[i]))
            insns.add(new InsnNode(Opcodes.AASTORE))
        }

        AbstractInsnNode first = methodNode.instructions.getFirst()
        methodNode.instructions.insertBefore(first, insns)
    }
}




static def ensureClinitWithGarbage (ClassNode classNode, Random rnd) {
    MethodNode clinit = null
    for (MethodNode m : classNode.methods) {
        if ("<clinit>" == m.name) {
            clinit = m
            break
        }
    }
    if (clinit == null) {
        clinit = new MethodNode(Opcodes.ACC_STATIC, "<clinit>", "()V", null, null)
        classNode.methods.add(clinit)
    }
    injectGarbageScattered(clinit, rnd)
}

static def randomChinese (Random rnd, int len) {
    StringBuilder sb = new StringBuilder()
    for (int i = 0; i < len; i++) {
        int base = 0x4E00
        int ch = base + rnd.nextInt(0x9FA5 - 0x4E00)
        sb.append((char) ch)
    }
    return sb.toString()
}